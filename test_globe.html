<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre Globe Test</title>
  <link rel="stylesheet" href="maplibre-gl.css" />
  <script src="maplibre-gl.js"></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    try {
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          projection: { type: 'globe' },
          sources: {
            'satellite': {
              type: 'raster',
              tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
              tileSize: 256,
              maxzoom: 19
            }
          },
          layers: [
            {
              id: 'satellite-layer',
              type: 'raster',
              source: 'satellite'
            }
          ]
        },
        center: [85.83, 19.80],
        zoom: 2.5
      });
      console.log('MapLibre initialized successfully!', map);
    } catch (e) {
      console.error('Error initializing MapLibre:', e);
    }
  </script>
</body>
</html>
